name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore JWTAuthentication.sln

      - name: Build
        run: dotnet build JWTAuthentication.sln --no-restore --configuration Release

      # Integration tests start PostgreSQL in Docker via Testcontainers (Docker is available on GitHub runners)
      - name: Test
        run: dotnet test JWTAuthentication.sln --no-build --configuration Release --logger "console;verbosity=normal"
